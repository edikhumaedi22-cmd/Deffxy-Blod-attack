<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Datang - Mading 9A SMP Islam Bustanul Ulum</title>
<style>
/* =========================================
   1. GLOBAL & RESET
   ========================================= */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

body {
  background: #020824;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

/* =========================================
   2. WELCOME OVERLAY (ANIMASI RAMAI)
   ========================================= */
.welcome {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #4facfe);
  background-size: 400% 400%;
  animation: gradientMove 8s ease infinite;
  overflow: hidden;
  transition: opacity 1s ease, transform 1s ease;
}

.welcome.hide {
  opacity: 0;
  transform: scale(1.2);
  pointer-events: none;
}

@keyframes gradientMove {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Bintang / Partikel */
.stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.star {
  position: absolute;
  color: #fff;
  font-size: 20px;
  animation: floatUp linear infinite;
  opacity: 0.7;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.9; }
  90% { opacity: 0.9; }
  100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
}

/* Gelembung */
.bubble {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(5px);
  animation: bubbleFloat 15s infinite ease-in-out;
}
@keyframes bubbleFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(50px,-100px) scale(1.2); }
}

/* Konten Tengah Welcome (Dinamai .welcome-content agar TIDAK bentrok dengan .content milik slide) */
.welcome-content {
  position: relative;
  z-index: 10;
  text-align: center;
  color: white;
  padding: 20px;
}

.logo {
  width: 130px;
  height: 130px;
  margin: 0 auto 25px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 70px;
  box-shadow: 0 0 40px rgba(255,255,255,0.6), 0 0 80px rgba(255,255,255,0.3);
  animation: logoPulse 2s ease-in-out infinite, logoEnter 1.2s ease-out;
}
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 0 40px rgba(255,255,255,0.6), 0 0 80px rgba(255,255,255,0.3); }
  50% { box-shadow: 0 0 60px rgba(255,255,255,0.9), 0 0 120px rgba(255,255,255,0.5); }
}
@keyframes logoEnter {
  0% { transform: scale(0) rotate(-360deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.welcome-text {
  font-size: 22px;
  letter-spacing: 8px;
  opacity: 0;
  animation: fadeDown 1s ease-out 0.5s forwards;
  text-transform: uppercase;
  font-weight: 300;
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

.school-name {
  font-size: 60px;
  font-weight: 900;
  margin: 15px 0;
  text-shadow: 0 5px 20px rgba(0,0,0,0.3);
  letter-spacing: 3px;
}
.school-name span {
  display: inline-block;
  opacity: 0;
  animation: letterBounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
}
@keyframes letterBounce {
  0% { opacity: 0; transform: translateY(-100px) rotate(-20deg) scale(0); }
  60% { transform: translateY(10px) rotate(5deg) scale(1.2); }
  100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
}

.tagline {
  font-size: 18px;
  font-style: italic;
  margin-bottom: 30px;
  opacity: 0;
  animation: fadeIn 1s ease-out 2.5s forwards;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
@keyframes fadeIn {
  to { opacity: 1; }
}

.typing {
  font-size: 16px;
  margin-bottom: 35px;
  min-height: 25px;
  opacity: 0;
  animation: fadeIn 0.5s ease-out 3s forwards;
}
.typing::after {
  content: '|';
  animation: blink 0.7s infinite;
  color: #fff;
}
@keyframes blink {
  50% { opacity: 0; }
}

.enter-btn {
  padding: 16px 50px;
  font-size: 18px;
  font-weight: bold;
  color: #764ba2;
  background: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0;
  animation: btnAppear 0.8s ease-out 3.5s forwards, btnFloat 2s ease-in-out 4.3s infinite;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.enter-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(118,75,162,0.3), transparent);
  transition: left 0.5s;
}
.enter-btn:hover::before { left: 100%; }
.enter-btn:hover {
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  background: #f093fb;
  color: white;
}
@keyframes btnAppear {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes btnFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* Icon Terbang */
.floating-icon {
  position: absolute;
  font-size: 40px;
  animation: iconFloat 10s ease-in-out infinite;
  opacity: 0.85;
  filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
}
@keyframes iconFloat {
  0%, 100% { transform: translate(0,0) rotate(0deg); }
  25% { transform: translate(30px,-40px) rotate(15deg); }
  50% { transform: translate(-20px,-80px) rotate(-10deg); }
  75% { transform: translate(-40px,-30px) rotate(20deg); }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-100vh) rotate(0); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* =========================================
   3. MADING 9A (BACKGROUND & SLIDE)
   (100% SAMA PERSIS SEPERTI KODE ASLI ANDA)
   ========================================= */
#bg-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('https://files.catbox.moe/4hpr94.jpg'); 
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  z-index: 0;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: rgba(2, 8, 36, 0.75);
  pointer-events: none;
}

.bg::after {
  content:""; 
  position:absolute; 
  right:0; top:0; width:45%; height:100%;
  background:repeating-linear-gradient(45deg, rgba(0,198,255,.10) 0 2px, transparent 2px 16px);
  clip-path:polygon(35% 0,100% 0,100% 100%,0 100%);
}

.hexbg {
  position:absolute;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:rgba(0,120,255,.08); 
  animation:floatHex 9s ease-in-out infinite;
}
@keyframes floatHex {
  0%,100% { transform:translateY(0) rotate(0deg); }
  50%     { transform:translateY(-25px) rotate(8deg); }
}

/* Slide (Tata letak side-by-side / di pinggir dipertahankan) */
.slide {
  position:fixed; inset:0; z-index:2;
  display:flex; align-items:center; justify-content:center;
  gap:60px; padding:40px 8%;
  opacity:0; visibility:hidden; transform:scale(1.15);
  transition:all .9s ease;
}
.slide.active { opacity:1; visibility:visible; transform:scale(1); }

.content > * { opacity:0; transform:translateX(-50px); transition:all .8s ease; }
.slide.active .content > *:nth-child(1){ transition-delay:.2s; }
.slide.active .content > *:nth-child(2){ transition-delay:.35s; }
.slide.active .content > *:nth-child(3){ transition-delay:.5s; }
.slide.active .content > *:nth-child(4){ transition-delay:.65s; }
.slide.active .content > *:nth-child(5){ transition-delay:.8s; }
.slide.active .content > * { opacity:1; transform:translateX(0); }

.visual { opacity:0; transform:scale(.5) rotate(-8deg); transition:all .9s cubic-bezier(.2,.8,.2,1); }
.slide.active .visual { opacity:1; transform:scale(1) rotate(0); transition-delay:.3s; }

/* Komponen Mading */
.pills { display:flex; gap:14px; margin-bottom:22px; }
.pill {
  background:#4db5ff; color:#032060; font-weight:700;
  font-size:13px; letter-spacing:1px; padding:8px 22px;
  border-radius:999px; text-transform:uppercase;
}
h1.judul { font-size:clamp(40px,7vw,72px); line-height:1.05; letter-spacing:2px;
  text-shadow:0 4px 18px rgba(0,0,0,.5); }
h2 { font-size:clamp(28px,4.5vw,44px); letter-spacing:2px; }
.byline { background:#1260d8; display:inline-block; padding:8px 16px;
  border-radius:6px; font-size:14px; margin:18px 0; }
.pembimbing p { margin:10px 0; font-size:16px; color:#cfe4ff; }
.pembimbing b { color:#7fd4ff; }

.robot { font-size:clamp(90px,15vw,170px);
  filter:drop-shadow(0 0 25px rgba(0,198,255,.6)); animation:floatHex 6s ease-in-out infinite; }

.hex-photo {
  width:clamp(220px,30vw,340px); height:clamp(250px,34vw,380px);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#2f80ff,#0a2a8f);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(70px,10vw,120px);
}

.box { background:rgba(0,110,255,.35); border-left:4px solid #35e0ff;
  padding:14px 18px; border-radius:8px; margin-top:16px; max-width:560px; 
  backdrop-filter: blur(4px); }
.box .tag { display:inline-block; background:#35e0ff; color:#032060;
  font-weight:700; padding:4px 14px; border-radius:6px; margin-bottom:8px; }
.box p { font-size:14px; color:#dceaff; line-height:1.5; }

.tombol {
  margin-top:26px;
  padding:14px 34px;
  font-size:15px; font-weight:700; letter-spacing:1px;
  color:#032060; background:linear-gradient(135deg,#00e0ff,#4db5ff);
  border:none; border-radius:999px; cursor:pointer;
  box-shadow:0 0 18px rgba(0,198,255,.5);
  transition:transform .2s ease, box-shadow .2s ease;
}
.tombol:hover { transform:translateY(-2px) scale(1.05); box-shadow:0 0 28px rgba(0,224,255,.8); }

/* Logo Intro Mading */
.logo-wrap { position:relative; width:280px; height:310px; }
.ring { position:absolute; clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
.ring.big { inset:-34px; background:linear-gradient(135deg,rgba(0,224,255,.35),rgba(0,98,255,.10));
  animation:spin 14s linear infinite reverse; }
.ring.main { inset:0; background:linear-gradient(135deg,#00e0ff,#0062ff); animation:spin 9s linear infinite; }
.ring.main::after { content:""; position:absolute; inset:10px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); background:#05103c; }
.hex-logo {
  position:absolute; inset:26px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#fff,#cfe0ff);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#0a3d91;
}
.hex-logo .em { font-size:80px; }
.hex-logo .tx { font-weight:800; letter-spacing:2px; margin-top:6px; }
@keyframes spin { to { transform:rotate(360deg); } }

.hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  z-index:5; font-size:12px; color:#7fa8ff; letter-spacing:1px; }

/* Responsif HANYA untuk animasi welcome, TIDAK mengubah layout slide */
@media (max-width: 600px) {
  .school-name { font-size: 36px; }
  .welcome-text { font-size: 16px; letter-spacing: 4px; }
  .logo { width: 90px; height: 90px; font-size: 50px; }
}
</style>
</head>
<body>

<!-- =========================================
     BAGIAN 1: WELCOME OVERLAY (ANIMASI RAMAI)
     ========================================= -->
<div class="welcome" id="welcome">
  <div class="stars" id="stars"></div>

  <!-- Icon terbang -->
  <div class="floating-icon" style="top:15%; left:10%; animation-delay:0s;">📚</div>
  <div class="floating-icon" style="top:20%; right:12%; animation-delay:1s;">🎓</div>
  <div class="floating-icon" style="bottom:20%; left:15%; animation-delay:2s;">✏️</div>
  <div class="floating-icon" style="bottom:25%; right:10%; animation-delay:0.5s;">🏫</div>
  <div class="floating-icon" style="top:50%; left:5%; animation-delay:1.5s;">⭐</div>
  <div class="floating-icon" style="top:45%; right:5%; animation-delay:2.5s;">🎨</div>
  <div class="floating-icon" style="top:70%; left:50%; animation-delay:3s;">📐</div>
  <div class="floating-icon" style="top:10%; left:50%; animation-delay:1.8s;">🔬</div>

  <div class="welcome-content">
    <div class="logo">🎓</div>
    <div class="welcome-text">Selamat Datang</div>
    <h1 class="school-name" id="schoolName"></h1>
    <p class="tagline">"Cerdas, Berkarakter, dan Berprestasi"</p>
    <div class="typing" id="typing"></div>
    <button class="enter-btn" onclick="enterSite()">Masuk ke Website →</button>
  </div>
</div>

<!-- =========================================
     BAGIAN 2: MADING 9A (KONTEN UTAMA)
     ========================================= -->
<div id="bg-image"></div>

<div class="bg">
  <div class="hexbg" style="width:220px;height:250px;top:8%;left:6%;"></div>
  <div class="hexbg" style="width:140px;height:160px;top:65%;left:12%;animation-delay:2s;"></div>
  <div class="hexbg" style="width:300px;height:340px;top:55%;left:75%;animation-delay:1s;"></div>
  <div class="hexbg" style="width:110px;height:125px;top:15%;left:80%;animation-delay:3s;"></div>
</div>

<!-- SLIDE 1 : INTRO LOGO -->
<div class="slide active">
  <div class="logo-wrap">
    <div class="ring big"></div>
    <div class="ring main"></div>
    <div class="hex-logo">
      <span class="em">🏫</span>
      <span class="tx">SMP IBU</span>
    </div>
  </div>
</div>

<!-- SLIDE 2 : JUDUL (HALAMAN UTAMA) -->
<div class="slide">
  <div class="content">
    <div class="pills"><span class="pill">SMP</span><span class="pill">IBU</span></div>
    <h1 class="judul">SELAMAT<br>DATANG</h1>
    <div class="byline">SMP ISLAM BUSTANUL ULUM</div>
    <div class="pembimbing">
      <p><b>DEVELOPER:</b> Nama : ????</p>
    </div>
  </div>
  <div class="visual robot">🦾</div>
</div>

<!-- SLIDE 3 : BAB 1 -->
<div class="slide">
  <div class="content">
    <div class="pills"><span class="pill"></span></div>
    <h2>HALAMAN 1<br>FOTO KELAS 9A</h2>
  </div>
  <div class="visual hex-photo">🎉🏢</div>
</div>

<!-- SLIDE 4 : LATAR BELAKANG (ada tombol pindah file) -->
<div class="slide">
  <div class="content">
    <h2></h2>
    <div class="box"><span class="tag">FOTO</span><p>GURU : KETUA : WAKIL</p></div>
    <div class="box"><span class="tag">JADWAL</span><p>PELAJARAN : PIKET</p></div>
    <button class="tombol" id="tombolLanjut">Lanjut ke Halaman Berikutnya ➜</button>
  </div>
  <div class="visual robot">🎉🔮</div>
</div>

<div class="hint" id="hint">— intro diputar... klik untuk lewati —</div>

<!-- =========================================
     BAGIAN 3: JAVASCRIPT (GABUNGAN)
     ========================================= -->
<script>
  // ==========================================
  // A. LOGIKA WELCOME ANIMATION
  // ==========================================
  
  // 1. Animasi nama sekolah per huruf
  const name = "SMP ISLAM BUSTANUL ULUM";
  const nameEl = document.getElementById('schoolName');
  name.split('').forEach((char, i) => {
    const span = document.createElement('span');
    span.textContent = char === ' ' ? '\u00A0' : char;
    span.style.animationDelay = (0.8 + i * 0.08) + 's';
    nameEl.appendChild(span);
  });

  // 2. Bintang / partikel naik
  const starsContainer = document.getElementById('stars');
  const symbols = ['✨', '⭐', '💫', '🌟', '✦', '•'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (Math.random() * 20 + 12) + 'px';
    s.style.animationDuration = (Math.random() * 10 + 8) + 's';
    s.style.animationDelay = Math.random() * 10 + 's';
    starsContainer.appendChild(s);
  }

  // 3. Gelembung
  for (let i = 0; i < 8; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = Math.random() * 150 + 50;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.top = Math.random() * 100 + '%';
    b.style.animationDelay = Math.random() * 5 + 's';
    document.getElementById('welcome').appendChild(b);
  }

  // 4. Typing effect
  const typingText = "Mencetak generasi unggul, kreatif, dan berakhlak mulia...";
  const typingEl = document.getElementById('typing');
  let idx = 0;
  setTimeout(() => {
    const typer = setInterval(() => {
      typingEl.textContent = typingText.substring(0, idx);
      idx++;
      if (idx > typingText.length) clearInterval(typer);
    }, 60);
  }, 3000);

  // 5. Confetti saat tombol muncul
  function launchConfetti() {
    const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#f368e0', '#ffffff'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (Math.random() * 3 + 2) + 's';
      c.style.animationDelay = Math.random() * 0.5 + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.getElementById('welcome').appendChild(c);
    }
  }
  setTimeout(launchConfetti, 3500);

  // 6. Fungsi Masuk ke Web
  function enterSite() {
    document.getElementById('welcome').classList.add('hide');
    setTimeout(() => {
      document.getElementById('welcome').style.display = 'none';
      // Pastikan slide mading langsung aktif jika user klik manual
      if (!mulai) masukUtama();
    }, 1000);
  }

  // ==========================================
  // B. LOGIKA SLIDE MADING 9A
  // ==========================================
  const FILE_SELANJUTNYA = "Deffxy.html";
  const slides = document.querySelectorAll('.slide');
  const hint = document.getElementById('hint');
  let i = 0, mulai = false;

  function go(n) {
    if (n === i || n < 0 || n >= slides.length) return;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
  }

  function masukUtama() {
    if (mulai) return;
    mulai = true;
    go(1); // langsung ke halaman utama
    hint.textContent = 'klik / panah kanan: lanjut •';
  }

  // Intro main SEKALI di awal (~3.5 detik agar sinkron dengan animasi welcome), lalu otomatis masuk halaman utama
  setTimeout(masukUtama, 3500);

  function next() { if (mulai && i < slides.length - 1) go(i + 1); }
  function prev() { if (mulai && i > 1) go(i - 1); }

  // Tombol di slide terakhir: pindah file
  document.getElementById('tombolLanjut').addEventListener('click', e => {
    e.stopPropagation(); 
    window.location.href = FILE_SELANJUTNYA;
  });

  document.addEventListener('click', (e) => { 
    // Jangan trigger next jika yang diklik adalah tombol enter atau tombol lanjut
    if (e.target.classList.contains('enter-btn') || e.target.classList.contains('tombol')) return;
    mulai ? next() : masukUtama(); 
  });
  
  document.addEventListener('keydown', e => {
    if (!mulai && (e.key === ' ' || e.key === 'Enter')) { masukUtama(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ') next();
    if (e.key === 'ArrowLeft') prev();
  });
</script>

</body>
</html>
